name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get install -y zlib1g-dev libffi-dev libssl-dev autoconf automake libtool pkg-config
          pip install buildozer cython setuptools

      - name: Patch buildozer aidl check
        run: |
          BPATH=$(python3 -c "import buildozer; import os; print(os.path.dirname(buildozer.__file__))")
          sed -i 's/self._check_aidl(installed_v_build_tools)/pass  # skip/' $BPATH/targets/android.py

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aofderslerim-apk
          path: bin/*.apk
