name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get install -y zlib1g-dev libffi-dev libssl-dev autoconf automake libtool pkg-config
          pip install buildozer cython setuptools

      - name: Setup SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0" "platforms;android-31"
          mkdir -p /home/runner/.buildozer/android/platform/
          ln -s $ANDROID_SDK_ROOT /home/runner/.buildozer/android/platform/android-sdk
          ln -s $ANDROID_NDK_ROOT /home/runner/.buildozer/android/platform/android-ndk-r25b

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aofderslerim-apk
          path: bin/*.apk
