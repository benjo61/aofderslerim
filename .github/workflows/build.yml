name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;33.0.0" "platforms;android-31" "platform-tools" "ndk;25.2.9519653"

      - name: Install Python deps
        run: |
          sudo apt-get install -y zlib1g-dev libffi-dev libssl-dev autoconf automake libtool pkg-config
          pip install buildozer cython setuptools

      - name: Configure buildozer
        run: |
          echo "android.sdk_path = $ANDROID_SDK_ROOT" >> buildozer.spec
          echo "android.ndk_path = $ANDROID_SDK_ROOT/ndk/25.2.9519653" >> buildozer.spec
          echo "android.build_tools_version = 33.0.0" >> buildozer.spec

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aofderslerim-apk
          path: bin/*.apk
