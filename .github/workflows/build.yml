name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install deps
        run: |
          sudo apt-get install -y zlib1g-dev libffi-dev libssl-dev
          pip install buildozer cython setuptools
      - name: Accept Android licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          yes | buildozer android debug || true
          yes | /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Build APK
        run: |
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aofderslerim-apk
          path: bin/*.apk
